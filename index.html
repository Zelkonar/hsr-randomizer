<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
        <link rel="shortcut icon" href="/favicon/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="HSR Randomizer" />
        <link rel="manifest" href="/favicon/site.webmanifest" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>HSR Randomizer: Honkai: Star Rail Team Randomizer</title>
        <meta
            name="description"
            content="HSR Randomizer generates random Honkai: Star Rail teams from the characters you own. Configure your roster, require a sustain, and roll up to four teams at once. Made by Zelkonar."
        />
        <link rel="canonical" href="https://hsr-randomizer.zelkonar.com/" />
        <meta name="author" content="Zelkonar" />
        <meta name="robots" content="index, follow, max-image-preview:large" />
        <meta name="theme-color" content="#030712" />

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="HSR Randomizer" />
        <meta property="og:title" content="HSR Randomizer: Honkai: Star Rail Team Randomizer" />
        <meta
            property="og:description"
            content="Generate random Honkai: Star Rail teams from the characters you own. Made by Zelkonar."
        />
        <meta property="og:url" content="https://hsr-randomizer.zelkonar.com/" />
        <meta property="og:image" content="https://hsr-randomizer.zelkonar.com/favicon/web-app-manifest-512x512.png" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="HSR Randomizer: Honkai: Star Rail Team Randomizer" />
        <meta
            name="twitter:description"
            content="Generate random Honkai: Star Rail teams from the characters you own. Made by Zelkonar."
        />
        <meta name="twitter:image" content="https://hsr-randomizer.zelkonar.com/favicon/web-app-manifest-512x512.png" />

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebApplication",
                "name": "HSR Randomizer",
                "alternateName": "Honkai: Star Rail Team Randomizer",
                "url": "https://hsr-randomizer.zelkonar.com/",
                "applicationCategory": "GameApplication",
                "operatingSystem": "Any",
                "description": "Generate random Honkai: Star Rail teams from the characters you own.",
                "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
                "author": {
                    "@type": "Person",
                    "name": "Zelkonar",
                    "alternateName": ["Zelk", "Zelkanar"],
                    "url": "https://github.com/Zelkonar",
                    "sameAs": ["https://github.com/Zelkonar"]
                }
            }
        </script>
        <script>
            // Resolve and apply the theme before first paint to avoid a flash of
            // the wrong theme. Mirrors getInitialTheme() in src/lib/theme.ts.
            (function () {
                try {
                    var stored = localStorage.getItem("hsr-randomizer:theme");
                    var theme =
                        stored === "light" || stored === "dark"
                            ? stored
                            : window.matchMedia("(prefers-color-scheme: light)").matches
                              ? "light"
                              : "dark";
                    if (theme === "dark") document.documentElement.classList.add("dark");
                    document.documentElement.style.colorScheme = theme;
                } catch (e) {}
            })();
        </script>
        <style>
            body {
                margin: 0;
                background-color: #e5e7eb;
            }
            html.dark body {
                background-color: #030712;
            }
            #hsr-loading {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
            }
            #hsr-loading .hsr-spinner {
                width: 2.5rem;
                height: 2.5rem;
                border: 3px solid rgba(0, 0, 0, 0.15);
                border-top-color: rgba(0, 0, 0, 0.6);
                border-radius: 50%;
                animation: hsr-spin 0.8s linear infinite;
            }
            html.dark #hsr-loading .hsr-spinner {
                border-color: rgba(255, 255, 255, 0.15);
                border-top-color: rgba(255, 255, 255, 0.7);
            }
            @keyframes hsr-spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <div id="root">
            <div id="hsr-loading">
                <div class="hsr-spinner"></div>
            </div>
            <noscript>
                <h1>HSR Randomizer</h1>
                <p>
                    A Honkai: Star Rail team randomizer by Zelkonar. Configure the characters you own, pick a mode, and
                    generate random teams from your roster. JavaScript is required to run the app.
                </p>
            </noscript>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
