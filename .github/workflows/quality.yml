name: Quality

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
            - release

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run format:check

            - run: npm run lint

            - run: npx tsc --noEmit

            - run: npm test
