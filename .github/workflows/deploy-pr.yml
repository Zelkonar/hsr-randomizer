# Opens the main -> release pull request that ships a cut version to production.
#
# release-please tags a version but does not deploy it: production tracks the
# release branch. Merging the release PR is what this watches for, because the
# release: published event it emits is created with GITHUB_TOKEN and therefore
# never triggers a workflow. A human merging that PR does produce a real push.
#
# Merging the deploy PR stays a deliberate step, and quality.yml runs on it first.
name: Deploy PR

on:
    push:
        branches:
            - main
    # Opens the deploy PR on demand, for a release cut before this existed or a
    # deploy PR that was closed without merging.
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: write

jobs:
    open-deploy-pr:
        # Only a release-please release commit marks a new version worth
        # shipping. Gating the job means ordinary pushes to main never start a
        # run at all, rather than starting one that exits immediately.
        if: >-
            github.event_name == 'workflow_dispatch' ||
            startsWith(github.event.head_commit.message, 'chore(main): release')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Open or update the deploy PR
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail

                  version=$(git describe --tags --abbrev=0)

                  ahead=$(git rev-list --count origin/release..origin/main)
                  if [ "$ahead" -eq 0 ]; then
                    echo "release is already up to date with main; nothing to deploy"
                    exit 0
                  fi
                  echo "main is $ahead commit(s) ahead of release"

                  title="deploy: $version"
                  body="Ships \`$version\` to production.

                  Merging deploys the release branch to Vercel. Review the diff first: it is
                  everything on main that production has not seen yet.

                  Opened automatically by .github/workflows/deploy-pr.yml"

                  existing=$(gh pr list --base release --head main --state open --json number --jq '.[0].number // empty')

                  if [ -n "$existing" ]; then
                    gh pr edit "$existing" --title "$title" --body "$body"
                    echo "updated existing deploy PR #$existing"
                  else
                    gh pr create --base release --head main --title "$title" --body "$body"
                  fi
